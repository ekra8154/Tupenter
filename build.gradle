plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'jacoco'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/" }
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/tupenter.accesswidener")

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu + Cloth Config
    modImplementation "com.terraformersmc:modmenu:16.0.0-rc.1"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:20.0.149"

    // Unit tests (net.tupenter.script is pure Java, no Minecraft deps)
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.slf4j:slf4j-api:2.0.9"
}

// The tests also cover the CLIENT source set, so they need its classes and
// everything it compiles against (Minecraft, Fabric). Plenty of that source is
// plain logic — config data, alias storage, the chat styler's span maths — and
// being in the client set was the only reason it went untested.
sourceSets {
    test {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.13"
}

// The report shows BOTH source sets. net.tupenter.script (the language) is
// Minecraft-free and reachable line-for-line; the client set is mostly GUI,
// mixins and registration glue that only runs in game — but the plain-logic
// parts of it (config, the alias/function stores, provider completion) turn out
// to run fine under JUnit, so they're tested and shown here too.
jacocoTestReport {
    dependsOn test
    additionalSourceDirs.from(files(sourceSets.client.allJava.srcDirs))
    additionalClassDirs.from(files(sourceSets.client.output))
    reports {
        html.required = true
        xml.required = true
    }
}

// A ratchet, not a target: the point of the number is that it can't quietly
// fall. New code arrives with tests or the build says so. Raise these when the
// real figure has moved up — never lower them to make a build pass.
//
// This rule sees only the MAIN source set (the default class dirs), so it's the
// language's gate and can't be diluted by the untestable half of the client set.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.90
            }
            limit {
                counter = 'LINE'
                minimum = 0.93
            }
        }
    }
}

// The client set can't carry a whole-package number — most of its lines need a
// running client. Instead each class we've actually brought under test carries
// its OWN floor, so those can't regress while the rest stays honestly at zero.
// A class earns a line here by getting a test; the floor is set below what it
// really scores, as headroom, and raised as coverage grows.
tasks.register('jacocoClientCoverageVerification', JacocoCoverageVerification) {
    dependsOn test
    executionData jacocoTestReport.executionData
    sourceDirectories.from(files(sourceSets.client.allJava.srcDirs))
    classDirectories.from(files(sourceSets.client.output))
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                    'net.tupenter.config.TupenterConfig',
                    'net.tupenter.command.CommandAliasManager',
                    'net.tupenter.command.CustomFunctionManager',
                    'net.tupenter.command.SlotVariableProvider',
            ]
            limit {
                counter = 'LINE'
                minimum = 0.75
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification, jacocoClientCoverageVerification

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}