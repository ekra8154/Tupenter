plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'jacoco'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/" }
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/tupenter.accesswidener")

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu + Cloth Config
    modImplementation "com.terraformersmc:modmenu:16.0.0-rc.1"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:20.0.149"

    // Unit tests (net.tupenter.script is pure Java, no Minecraft deps)
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.slf4j:slf4j-api:2.0.9"
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Coverage measures the LANGUAGE, not the mod wiring: net.tupenter.script is
// the parser, evaluator and executor, and it's Minecraft-free, so every line of
// it is reachable from a plain JUnit run. The client source set is Minecraft
// wiring that only runs in game — it isn't on the test classpath at all, so it
// never enters these numbers and can't dilute them.
jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

// A ratchet, not a target: the point of the number is that it can't quietly
// fall. New code arrives with tests or the build says so. Raise these when the
// real figure has moved up — never lower them to make a build pass.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.90
            }
            limit {
                counter = 'LINE'
                minimum = 0.93
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}