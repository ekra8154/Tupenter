# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
# The Minecraft versions THIS branch's jar is built to serve. Drives both the
# jar name and the "minecraft" dependency in fabric.mod.json, so the two can
# never disagree. Either a single version (1.21.10), a range (1.21.10-1.21.11)
# or an x-range (26.2.x). UPPORT_NOTES.md records where the boundaries are.
minecraft_support_range=26.2.x
loader_version=0.19.3
loom_version=1.17.12

# Mod Properties
mod_version=1.1.0
maven_group=net.tupenter
archives_base_name=tupenter

# Dependencies
# These move together with minecraft_version — see the matrix in UPPORT_NOTES.md.
fabric_version=0.152.2+26.2
modmenu_version=20.0.0-beta.3
cloth_config_version=26.2.155